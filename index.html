<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fox Coin Chase</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#87ceeb}
  body{display:grid;place-items:center;font-family:Arial,sans-serif}
  canvas{display:block;background:linear-gradient(#87ceeb 0 68%,#72b84a 68%);max-width:100vw;max-height:100vh}
  #ui{position:fixed;top:12px;left:12px;background:#fff;padding:8px 12px;border-radius:10px;font-weight:bold}
  #start{position:fixed;inset:0;display:grid;place-items:center;background:#0006;color:white}
  #start div{text-align:center}
  button{padding:12px 24px;border:0;border-radius:10px;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<div id="ui">Coins: <span id="score">0</span></div>
<div id="start">
  <div>
    <h1>🦊 Fox Coin Chase</h1>
    <p>Fox runs forward automatically. Press SPACE at the right moment to jump and catch the coins!</p>
    <button id="play">START</button>
  </div>
</div>

<script>
const c=document.querySelector("canvas"),x=c.getContext("2d");
const scoreEl=document.querySelector("#score"), start=document.querySelector("#start");
const keys={};
let playing=false,score=0,best=Number(localStorage.getItem("foxBest")||0);
let distance=0, speed=5, combo=0, comboTimer=0, coins=[], obstacles=[], particles=[], clouds=[];
let shake=0, jumpHeld=false;

const fox={x:150,y:0,size:28,vy:0,onGround:true,coyote:0};
const gravity=.7, jump=-12.5;

function saveBest(){
  try{localStorage.setItem("foxBest",best)}catch(e){}
}
function reset(){
  score=0; distance=0; speed=5; combo=0; comboTimer=0; shake=0;
  fox.x=150; fox.y=300; fox.vy=0; fox.onGround=true; fox.coyote=0;
  coins=[]; obstacles=[]; particles=[];
  spawnCoin(700); spawnCoin(1000); spawnCoin(1300); spawnCoin(1580);
  spawnObstacle(900); spawnObstacle(1450);
}
function spawnCoin(px){
  coins.push({x:px,y:205+Math.random()*65,r:10,bob:Math.random()*6.28,got:false});
}
function spawnObstacle(px){
  obstacles.push({x:px,y:c.height*.68-10,w:25+Math.random()*15,h:28+Math.random()*18});
}
function burst(px,py,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:25+Math.random()*20});
  }
}
function jump(){
  if(fox.onGround||fox.coyote>0){
    fox.vy=jump;
    fox.onGround=false;
    fox.coyote=0;
    burst(fox.x,fox.y+25,6);
  }
}

addEventListener("keydown",e=>{
  if(["Space","ArrowLeft","ArrowRight","ArrowUp"].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==="Space"&&!e.repeat)jump();
  if(!playing && (e.code==="Space"||e.code==="Enter")){
    reset();playing=true;start.style.display="none";
  }
});
addEventListener("keyup",e=>keys[e.code]=false);
document.querySelector("#play").onclick=()=>{
  reset();playing=true;start.style.display="none";
};

function update(){
  if(!playing)return;

  // Arrow keys give the fox limited control over its position while the world scrolls.
  if(keys.ArrowLeft)fox.x-=3.5;
  if(keys.ArrowRight)fox.x+=3.5;
  fox.x=Math.max(70,Math.min(300,fox.x));

  if(keys.ArrowUp&&!jumpHeld){jump();jumpHeld=true}
  if(!keys.ArrowUp)jumpHeld=false;

  if(!fox.onGround)fox.coyote=Math.max(0,fox.coyote-1);
  fox.vy+=gravity;
  fox.y+=fox.vy;

  const ground=c.height*.68-25;
  if(fox.y>=ground){
    if(!fox.onGround)burst(fox.x,ground+25,4);
    fox.y=ground;fox.vy=0;fox.onGround=true;fox.coyote=6;
  }else if(fox.onGround){
    fox.onGround=false;fox.coyote=6;
  }

  distance+=speed;
  speed=Math.min(9.5,5+distance/7000);

  for(const coin of coins){
    coin.x-=speed;coin.bob+=.08;
    const cy=coin.y+Math.sin(coin.bob)*7;
    if(!coin.got&&Math.hypot(fox.x-coin.x,fox.y-cy)<fox.size+coin.r){
      coin.got=true;
      const now=performance.now();
      comboTimer=120;
      combo++;
      const gain=Math.min(1+Math.floor(combo/5),5);
      score+=gain;
      scoreEl.textContent=score;
      burst(coin.x,cy,14);
    }
  }
  coins=coins.filter(o=>o.x>-40&&!o.got);

  for(const o of obstacles){
    o.x-=speed;
    if(fox.x+18>o.x&&fox.x-18<o.x+o.w&&fox.y+20>o.y-o.h){
      playing=false;
      if(score>best){best=score;saveBest()}
      start.querySelector("h1").textContent="💥 Ouch!";
      start.querySelector("p").textContent=`Score: ${score}  •  Best: ${best}  •  Coins get faster!`;
      start.querySelector("button").textContent="RUN AGAIN";
      start.style.display="grid";
      burst(fox.x,fox.y,25);
    }
  }
  obstacles=obstacles.filter(o=>o.x>-60);

  const lastCoin=coins[coins.length-1];
  if(!lastCoin||lastCoin.x<850)spawnCoin(Math.max(850,lastCoin?lastCoin.x+260+Math.random()*230:850));
  const lastObs=obstacles[obstacles.length-1];
  if(!lastObs||lastObs.x<900)spawnObstacle(Math.max(950,lastObs?lastObs.x+420+Math.random()*350:950));

  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--}
  particles=particles.filter(p=>p.life>0);

  if(comboTimer>0)comboTimer--; else combo=0;
}

function draw(){
  x.save();
  if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.9}

  x.clearRect(-20,-20,c.width+40,c.height+40);

  // sky
  const sky=x.createLinearGradient(0,0,0,c.height);
  sky.addColorStop(0,"#74c8ff");sky.addColorStop(.7,"#c8ecff");sky.addColorStop(1,"#ffd27a");
  x.fillStyle=sky;x.fillRect(0,0,c.width,c.height);

  // sun
  x.fillStyle="#ffe88a";x.beginPath();x.arc(650,90,42,0,Math.PI*2);x.fill();

  // distant hills
  x.fillStyle="#8fc66a";
  for(let i=-1;i<6;i++){
    const hx=i*190-((distance*.15)%190);
    x.beginPath();x.arc(hx,310,125,Math.PI,0);x.fill();
  }

  // clouds
  x.fillStyle="#fff9";
  for(let i=0;i<4;i++){
    const cx=((i*250-distance*.04)%950)-80,cy=65+i%2*50;
    x.beginPath();x.arc(cx,cy,22,0,Math.PI*2);x.arc(cx+28,cy-8,28,0,Math.PI*2);x.arc(cx+60,cy,20,0,Math.PI*2);x.fill();
  }

  // ground
  const gy=c.height*.68;
  x.fillStyle="#68ad43";x.fillRect(0,gy,c.width,c.height-gy);
  x.fillStyle="#4e8d32";x.fillRect(0,gy,c.width,6);

  // little ground streaks
  x.fillStyle="#82c653";
  for(let i=0;i<20;i++){
    const gx=((i*70-distance)%850)-20;
    x.fillRect(gx,gy+22+(i%3)*20,28,3);
  }

  // coins
  for(const coin of coins){
    const cy=coin.y+Math.sin(coin.bob)*7;
    x.fillStyle="#0002";x.beginPath();x.arc(coin.x+3,cy+4,11,0,Math.PI*2);x.fill();
    x.fillStyle="#ffd21f";x.beginPath();x.arc(coin.x,cy,coin.r,0,Math.PI*2);x.fill();
    x.strokeStyle="#b8860b";x.lineWidth=3;x.stroke();
    x.fillStyle="#fff3a3";x.beginPath();x.arc(coin.x-3,cy-3,3,0,Math.PI*2);x.fill();
  }

  // obstacles
  for(const o of obstacles){
    x.fillStyle="#6e4a32";
    x.fillRect(o.x,o.y-o.h,o.w,o.h);
    x.fillStyle="#4f3525";
    x.fillRect(o.x+5,o.y-o.h+6,5,o.h-6);
    x.fillStyle="#80bd43";
    x.fillRect(o.x-3,o.y-o.h,o.w+6,7);
  }

  // fox shadow
  x.fillStyle="#0002";x.beginPath();x.ellipse(fox.x,gy-2,27,7,0,0,Math.PI*2);x.fill();

  // fox
  x.fillStyle="#e87522";x.beginPath();x.arc(fox.x,fox.y,fox.size,0,Math.PI*2);x.fill();
  // tail
  x.beginPath();x.arc(fox.x-30,fox.y+10,19,0,Math.PI*2);x.fill();
  x.fillStyle="#fff1dc";x.beginPath();x.arc(fox.x-43,fox.y+3,9,0,Math.PI*2);x.fill();
  // ears
  x.fillStyle="#e87522";x.beginPath();
  x.moveTo(fox.x-22,fox.y-18);x.lineTo(fox.x-15,fox.y-40);x.lineTo(fox.x-2,fox.y-23);
  x.moveTo(fox.x+2,fox.y-23);x.lineTo(fox.x+15,fox.y-40);x.lineTo(fox.x+22,fox.y-18);x.fill();
  // muzzle
  x.fillStyle="#fff1dc";x.beginPath();x.arc(fox.x+9,fox.y+8,13,0,Math.PI*2);x.fill();
  // eyes/nose
  x.fillStyle="#222";x.beginPath();x.arc(fox.x+5,fox.y-5,3,0,Math.PI*2);x.arc(fox.x+18,fox.y-5,3,0,Math.PI*2);x.fill();
  x.beginPath();x.arc(fox.x+20,fox.y+8,3,0,Math.PI*2);x.fill();

  // particles
  for(const p of particles){
    x.globalAlpha=Math.max(0,p.life/35);
    x.fillStyle="#ffd21f";x.fillRect(p.x,p.y,4,4);
  }
  x.globalAlpha=1;

  // HUD
  x.fillStyle="#0008";x.roundRect(12,12,190,62,12);x.fill();
  x.fillStyle="white";x.font="bold 18px Arial";
  x.fillText("🪙 "+score,26,38);
  x.font="13px Arial";x.fillText(combo>1?"COMBO ×"+combo:"Catch the coins!",26,60);

  x.restore();
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
