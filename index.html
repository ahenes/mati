<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Memory Quiz</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#eee;margin:0;padding:20px}
h1{margin:10px}
#game{width:500px;max-width:95vw;margin:20px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{height:75px;font-size:28px;cursor:pointer;border:2px solid #333;border-radius:8px;background:#333;color:#fff}
.card.open,.card.matched{background:#fff;color:#111}
.card.matched{cursor:default}
#quiz{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}
#quizBox{background:#fff;color:#111;padding:25px;border-radius:12px;width:420px;max-width:90vw}
.answer{display:block;width:100%;margin:8px 0;padding:12px;border:1px solid #888;border-radius:7px;background:#f5f5f5;cursor:pointer;font-size:16px}
.answer:hover{background:#ddd}
#quizMessage{font-weight:bold;min-height:20px}
button#restart{padding:10px 20px;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<h1>🔎 Mystery Memory</h1>
<p>Pairs: <span id="pairs">0</span>/12 &nbsp; | &nbsp; Moves: <span id="moves">0</span></p>

<div id="game"></div>
<button id="restart">Restart</button>

<div id="quiz">
  <div id="quizBox">
    <h2>🕵️ Case Question</h2>
    <p id="question"></p>
    <div id="answers"></div>
    <p id="quizMessage"></p>
  </div>
</div>

<script>
const symbols=[
"🔎","🔦","🗝️","🧭","📜","⭐",
"🕵️","🧩","🔐","📷","🗺️","🎧"
];

const questions=[
 {q:"Which tool is most useful for looking for tiny clues?",a:["Magnifying glass","Hammer","Umbrella"],correct:0},
 {q:"What do detectives usually look for at a mystery scene?",a:["Clues","Sandwiches","Sunglasses"],correct:0},
 {q:"Which item can help you find your direction?",a:["Compass","Pillow","Cup"],correct:0},
 {q:"What should a good detective do with an important clue?",a:["Remember it","Throw it away","Hide it"],correct:0},
 {q:"Which object is normally used to open a lock?",a:["Key","Spoon","Book"],correct:0},
 {q:"What is a mystery that has been solved?",a:["A case","A cloud","A bicycle"],correct:0},
 {q:"Which one could help document evidence?",a:["Camera","Fork","Balloon"],correct:0},
 {q:"What does a map help you find?",a:["Locations","Recipes","Songs"],correct:0},
 {q:"What should you do when you discover an interesting clue?",a:["Investigate it","Ignore it","Eat it"],correct:0},
 {q:"Which object is best for listening secretly from a distance?",a:["Headphones","Plate","Boot"],correct:0},
 {q:"What do detectives use to connect pieces of information?",a:["Reasoning","Guessing blindly","Sleeping"],correct:0},
 {q:"What is the main goal of solving a mystery?",a:["Find out what happened","Make more mystery","Lose the clues"],correct:0}
];

let cards=[];
let first=null;
let second=null;
let waiting=false;
let moves=0;
let pairs=0;
let questionIndex=0;

const game=document.getElementById("game");
const movesText=document.getElementById("moves");
const pairsText=document.getElementById("pairs");
const quiz=document.getElementById("quiz");
const question=document.getElementById("question");
const answers=document.getElementById("answers");
const quizMessage=document.getElementById("quizMessage");

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
}

function newGame(){
  game.innerHTML="";
  first=null;
  second=null;
  waiting=false;
  moves=0;
  pairs=0;
  questionIndex=0;
  quiz.style.display="none";
  movesText.textContent="0";
  pairsText.textContent="0";

  cards=[...symbols,...symbols];
  shuffle(cards);

  cards.forEach(symbol=>{
    const card=document.createElement("button");
    card.className="card";
    card.textContent="?";
    card.dataset.symbol=symbol;
    card.onclick=()=>flip(card);
    game.appendChild(card);
  });
}

function flip(card){
  if(waiting)return;
  if(card.classList.contains("open"))return;
  if(card.classList.contains("matched"))return;

  card.classList.add("open");
  card.textContent=card.dataset.symbol;

  if(first===null){
    first=card;
    return;
  }

  second=card;
  moves++;
  movesText.textContent=moves;

  if(first.dataset.symbol===second.dataset.symbol){
    first.classList.add("matched");
    second.classList.add("matched");
    first=null;
    second=null;
    pairs++;
    pairsText.textContent=pairs;

    waiting=true;
    setTimeout(showQuiz,300);
  }else{
    waiting=true;
    setTimeout(()=>{
      first.classList.remove("open");
      second.classList.remove("open");
      first.textContent="?";
      second.textContent="?";
      first=null;
      second=null;
      waiting=false;
    },700);
  }
}

function showQuiz(){
  const item=questions[questionIndex%questions.length];
  questionIndex++;

  question.textContent=item.q;
  answers.innerHTML="";
  quizMessage.textContent="";

  item.a.forEach((answer,index)=>{
    const button=document.createElement("button");
    button.className="answer";
    button.textContent=answer;
    button.onclick=()=>answerQuestion(index,item.correct);
    answers.appendChild(button);
  });

  quiz.style.display="flex";
}

function answerQuestion(selected,correct){
  if(selected===correct){
    quizMessage.textContent="✓ Correct! Continue the investigation.";
    setTimeout(()=>{
      quiz.style.display="none";
      waiting=false;

      if(pairs===symbols.length){
        setTimeout(()=>{
          alert("🎉 Case solved! You found all 12 pairs in "+moves+" moves.");
        },100);
      }
    },500);
  }else{
    quizMessage.textContent="✗ Not quite. Try again!";
  }
}

document.getElementById("restart").onclick=newGame;

newGame();
</script>

</body>
</html>
