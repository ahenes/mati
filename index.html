<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0f0a1e;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 960px;
    height: 540px;
    max-width: 96vw;
    max-height: 96vh;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    background: #2d1442;
  }
  .hud {
    position: absolute; top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between;
    pointer-events: none; z-index: 5;
    font-variant-numeric: tabular-nums;
  }
  .panel {
    background: rgba(20,12,30,0.6);
    padding: 8px 14px; border-radius: 10px;
    font-weight: 700; font-size: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .coin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff5a0, #f4c430 60%, #b8860b);
    box-shadow: 0 0 8px rgba(255,215,0,0.6);
  }
  .combo { color: #ff9a3d; font-size: 0.85em; opacity: 0; transition: opacity 0.2s; }
  .combo.show { opacity: 1; }
  .best { color: #c8b6ff; }
  .powerups {
    position: absolute; top: 58px; left: 14px;
    display: flex; gap: 8px; z-index: 5; pointer-events: none;
  }
  .pw-chip {
    background: rgba(20,12,30,0.6); padding: 5px 11px; border-radius: 20px;
    font-size: 12px; font-weight: 700; display: none; align-items: center; gap: 5px;
  }
  .pw-chip.active { display: flex; }
  .pw-chip.magnet { color: #ff6ec7; box-shadow: 0 0 10px rgba(255,110,199,0.4); }
  .pw-chip.star { color: #ffd93d; box-shadow: 0 0 10px rgba(255,217,61,0.4); }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: radial-gradient(ellipse at center, rgba(20,10,40,0.7), rgba(0,0,0,0.9));
    z-index: 10; padding: 20px; text-align: center;
  }
  .overlay.hidden { display: none; }
  h1 {
    font-size: 48px; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(135deg, #ffd93d 0%, #ff6ec7 50%, #a084ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  .tag { font-size: 14px; opacity: 0.85; margin-bottom: 24px; max-width: 460px; line-height: 1.5; }
  .btn {
    padding: 13px 32px; font-size: 18px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(180deg, #ffd93d 0%, #ff9a3d 100%);
    border: none; border-radius: 30px; color: #3a1f0a; cursor: pointer;
    box-shadow: 0 5px 0 #b26900, 0 10px 20px rgba(255,154,61,0.4);
    text-transform: uppercase;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b26900; }
  .controls { margin-top: 20px; font-size: 12px; opacity: 0.7; line-height: 1.7; }
  .key {
    display: inline-block; padding: 2px 7px;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px; font-family: monospace; font-size: 11px; margin: 0 2px;
  }
  .final-score { font-size: 34px; font-weight: 800; color: #ffd93d; margin-bottom: 6px; }
  .final-stats { font-size: 13px; opacity: 0.75; margin-bottom: 20px; }
  .new-best {
    padding: 4px 12px; background: linear-gradient(90deg, #ff6ec7, #a084ff);
    border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 1px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div class="hud">
    <div class="panel"><div class="coin-dot"></div><span id="score">0</span><span class="combo" id="combo">×1</span></div>
    <div class="panel best">BEST <span id="best">0</span></div>
  </div>
  <div class="powerups">
    <div class="pw-chip magnet" id="magnetChip">🧲 <span id="magnetTime">0.0</span>s</div>
    <div class="pw-chip star" id="starChip">⭐ <span id="starTime">0.0</span>s</div>
  </div>
  <div id="startScreen" class="overlay">
    <h1>COIN DASH</h1>
    <div class="tag">Sprint through the sunset. Grab coins. Dodge spikes. Snatch power-ups.</div>
    <button class="btn" id="startBtn">Start Run</button>
    <div class="controls">
      <div><span class="key">Space</span> <span class="key">↑</span> <span class="key">Click</span> — Jump (hold for higher, tap again for double jump)</div>
      <div><span class="key">P</span> pause · <span class="key">M</span> mute</div>
    </div>
  </div>
  <div id="gameOverScreen" class="overlay hidden">
    <div id="newBestBadge" class="new-best" style="display:none">NEW BEST!</div>
    <h1>Nice Run</h1>
    <div class="final-score">🪙 <span id="finalScore">0</span></div>
    <div class="final-stats"><span id="finalDistance">0</span>m · Top combo ×<span id="finalCombo">1</span></div>
    <button class="btn" id="restartBtn">Play Again</button>
    <div class="controls"><span class="key">Space</span> to restart</div>
  </div>
  <div id="pauseScreen" class="overlay
